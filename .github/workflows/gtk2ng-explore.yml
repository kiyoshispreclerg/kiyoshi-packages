# Exploration of the gtk2-ng line: in a container of each target, shows how the
# distro packages its GTK2, whether its patches apply to gtk2-ng, and whether
# gtk2-ng builds with that packaging and keeps the ABI. Publishes nothing; the
# result is the job summary and the `gtk2ng-<target>` artifacts.
name: GTK2-ng exploration

on:
    workflow_dispatch:
        inputs:
            ref:
                description: 'gtk2-ng branch, tag or commit; empty = master (gtk2-ng); x-density, later king'
                required: false
            url:
                description: 'gtk2-ng git URL; empty = kiyoshispreclerg/gtk2-ng (its master mirrors Devuan)'
                required: false

permissions:
    contents: read

jobs:
    explore:
        runs-on: ubuntu-24.04
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { image: 'ubuntu:22.04', target: ubuntu22.04 }
                    - { image: 'ubuntu:24.04', target: ubuntu24.04 }
                    - { image: 'ubuntu:26.04', target: ubuntu26.04 }
                    - { image: 'debian:12', target: debian12 }
                    - { image: 'debian:13', target: debian13 }
        container:
            image: ${{ matrix.image }}
        steps:
            - name: Get the script
              run: |
                  apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
                  git clone -q --depth 1 "https://github.com/${GITHUB_REPOSITORY}" repo
                  cd repo && git fetch -q --depth 1 origin "$GITHUB_SHA" && git checkout -q "$GITHUB_SHA"
            - name: Explore
              env:
                  GTK2NG_REF: ${{ inputs.ref }}
                  GTK2NG_URL: ${{ inputs.url }}
              run: |
                  [ -n "$GTK2NG_REF" ] || unset GTK2NG_REF
                  [ -n "$GTK2NG_URL" ] || unset GTK2NG_URL
                  REPORT_DIR="$PWD/report" repo/gtk2ng/scripts/explore.sh
                  cat report/summary.md >> "$GITHUB_STEP_SUMMARY"
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: gtk2ng-${{ matrix.target }}
                  path: report/
