# Installs kiyoshi-packages-repo_all.deb, downloaded from the published site,
# in a clean container of each target, and checks key, source, apt update,
# the channel choice and removal. Run it after Publish.
name: Test repo deb
on:
    workflow_dispatch:
permissions:
    contents: read
defaults:
    run:
        shell: bash
jobs:
    test:
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { image: 'ubuntu:22.04', suite: jammy }
                    - { image: 'ubuntu:24.04', suite: noble }
                    - { image: 'ubuntu:26.04', suite: resolute }
                    - { image: 'debian:12', suite: bookworm }
                    - { image: 'debian:13', suite: trixie }
                    # derivatives: the suite is the one of the base (UBUNTU_CODENAME / debian_version)
                    - { image: 'linuxmintd/mint21-amd64', suite: jammy }
                    - { image: 'linuxmintd/mint22-amd64', suite: noble }
                    - { image: 'linuxmintd/lmde7-amd64', suite: trixie }
        container: ${{ matrix.image }}
        env:
            DEBIAN_FRONTEND: noninteractive
        steps:
            - name: install the deb
              run: |
                  set -eux
                  apt-get update
                  apt-get install -y --no-install-recommends ca-certificates curl
                  owner="${GITHUB_REPOSITORY%%/*}"
                  curl -fsSL -o /tmp/repo.deb "https://${owner,,}.github.io/${GITHUB_REPOSITORY#*/}/kiyoshi-packages-repo_all.deb"
                  # a previous manual setup (other Signed-By) must not conflict
                  url="https://${owner,,}.github.io/${GITHUB_REPOSITORY#*/}"
                  dpkg-deb -x /tmp/repo.deb /tmp/x
                  install -D -m 0644 /tmp/x/usr/share/keyrings/kiyoshi-packages.gpg /etc/apt/keyrings/kiyoshi-packages.gpg
                  echo "deb [signed-by=/etc/apt/keyrings/kiyoshi-packages.gpg] $url ${{ matrix.suite }} main" > /etc/apt/sources.list.d/kiyoshi-packages.list
                  apt-get update
                  apt-get install -y /tmp/repo.deb
                  test -f /etc/apt/sources.list.d/kiyoshi-packages.list.save
                  test ! -e /etc/apt/sources.list.d/kiyoshi-packages.list
            - name: check source, key and apt update
              run: |
                  set -eux
                  f=/etc/apt/sources.list.d/kiyoshi-packages.sources
                  cat "$f"
                  grep -q '^Suites: ${{ matrix.suite }}$' "$f"
                  grep -q '^Components: main$' "$f"
                  test -s /usr/share/keyrings/kiyoshi-packages.gpg
                  apt-get update 2>&1 | tee /tmp/update.log
                  if grep -Ei '^(E|W):' /tmp/update.log; then exit 1; fi
                  policy="$(apt-cache policy kiyoshi-packages-repo)"
                  grep -q kiyoshispreclerg <<<"$policy"
            - name: change channel to beta
              run: |
                  set -eux
                  echo 'kiyoshi-packages-repo kiyoshi-packages-repo/channel select beta' | debconf-set-selections
                  dpkg-reconfigure -f noninteractive kiyoshi-packages-repo
                  grep -q '^Components: main beta$' /etc/apt/sources.list.d/kiyoshi-packages.sources
                  apt-get update
            - name: remove and purge
              run: |
                  set -eux
                  apt-get remove -y kiyoshi-packages-repo
                  if test -e /etc/apt/sources.list.d/kiyoshi-packages.sources; then echo 'source left behind'; exit 1; fi
                  if test -e /usr/share/keyrings/kiyoshi-packages.gpg; then echo 'key left behind'; exit 1; fi
                  apt-get purge -y kiyoshi-packages-repo
                  apt-get update
