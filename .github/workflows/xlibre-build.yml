# Builds XLibre (upstream, via NexusSfan's Debian packaging) and xserver-xis-core
# (the XiS fork, from the xis-* tag matching the XLibre tag of each channel) on
# each target, in a container of that distro, then installs them in a clean
# container of the same distro and checks them.
name: XLibre

# Manual only: it takes hours, so it runs when you start it (Actions > XLibre >
# Run workflow), e.g. when a new upstream tag appears.
#
# With no commit typed it builds everything from the newest release tag of each
# channel. Typing a commit (and its revision) for a core server builds only that
# core from the commit, e.g. xis 25.1.10-2: the commit must be the release tag's
# commit or a descendant of it (checked first, by the `plan` job), and the other
# packages are not rebuilt (run once without commits before).
on:
    workflow_dispatch:
        inputs:
            revision:
                description: 'XiS release revision of the full build (1, 2, ...); empty = 1'
                required: false
            xlibre_25_1_commit:
                description: 'xserver-xlibre-core 25.1: full SHA to build instead of the tag (only the core is built)'
                required: false
            xlibre_25_1_rev:
                description: 'xserver-xlibre-core 25.1: revision of that commit (2 gives 25.1.10-2); required with a commit'
                required: false
            xlibre_25_2_commit:
                description: 'xserver-xlibre-core 25.2: full SHA to build instead of the tag (only the core is built)'
                required: false
            xlibre_25_2_rev:
                description: 'xserver-xlibre-core 25.2: revision of that commit (2 gives 25.2.3-2); required with a commit'
                required: false
            xis_25_1_commit:
                description: 'xserver-xis-core 25.1: full SHA of the fork to build instead of the tag (only the core is built)'
                required: false
            xis_25_1_rev:
                description: 'xserver-xis-core 25.1: XiS revision of that commit (2 gives 25.1.10-1xis2); required with a commit'
                required: false
            xis_25_2_commit:
                description: 'xserver-xis-core 25.2: full SHA of the fork to build instead of the tag (only the core is built)'
                required: false
            xis_25_2_rev:
                description: 'xserver-xis-core 25.2: XiS revision of that commit (2 gives 25.2.3-1xis2); required with a commit'
                required: false
            only:
                description: 'Only these sources (space separated names from sources.txt, or xserver-xis-core); empty = all; not with commits'
                required: false
            release:
                description: 'Add the result to the apt repository'
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    plan:
        name: check the inputs
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        defaults:
            run:
                shell: bash
        env:
            ONLY: ${{ inputs.only }}
            XLIBRE_STABLE_COMMIT: ${{ inputs.xlibre_25_1_commit }}
            XLIBRE_STABLE_REV: ${{ inputs.xlibre_25_1_rev }}
            XLIBRE_BETA_COMMIT: ${{ inputs.xlibre_25_2_commit }}
            XLIBRE_BETA_REV: ${{ inputs.xlibre_25_2_rev }}
            XIS_STABLE_COMMIT: ${{ inputs.xis_25_1_commit }}
            XIS_STABLE_REV: ${{ inputs.xis_25_1_rev }}
            XIS_BETA_COMMIT: ${{ inputs.xis_25_2_commit }}
            XIS_BETA_REV: ${{ inputs.xis_25_2_rev }}
        outputs:
            commit: ${{ steps.plan.outputs.commit }}
            matrix: ${{ steps.plan.outputs.matrix }}
        steps:
            - uses: actions/checkout@v4
            - id: plan
              run: xlibre/scripts/plan.sh

    build:
        name: ${{ matrix.channel }} ${{ matrix.name }}
        needs: plan
        runs-on: ubuntu-24.04
        timeout-minutes: 150
        container:
            image: ${{ matrix.image }}
        strategy:
            fail-fast: false
            # from the plan job: all 10, or only the channels that have a commit
            matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
        defaults:
            run:
                shell: bash
        env:
            CHANNEL: ${{ matrix.channel }}
            XIS_REVISION: ${{ inputs.revision }}
            ONLY: ${{ inputs.only }}
            XLIBRE_STABLE_COMMIT: ${{ inputs.xlibre_25_1_commit }}
            XLIBRE_STABLE_REV: ${{ inputs.xlibre_25_1_rev }}
            XLIBRE_BETA_COMMIT: ${{ inputs.xlibre_25_2_commit }}
            XLIBRE_BETA_REV: ${{ inputs.xlibre_25_2_rev }}
            XIS_STABLE_COMMIT: ${{ inputs.xis_25_1_commit }}
            XIS_STABLE_REV: ${{ inputs.xis_25_1_rev }}
            XIS_BETA_COMMIT: ${{ inputs.xis_25_2_commit }}
            XIS_BETA_REV: ${{ inputs.xis_25_2_rev }}
        steps:
            - name: git and certificates (so checkout does a real clone)
              run: |
                  for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
                      [ -f "$f" ] && sed -i -E 's#https?://(archive|security)\.ubuntu\.com/ubuntu/?#http://azure.archive.ubuntu.com/ubuntu/#g' "$f"
                  done
                  apt-get update
                  apt-get install -y --no-install-recommends git ca-certificates
            - uses: actions/checkout@v4
            - run: xlibre/scripts/bootstrap.sh
            - name: build
              run: xlibre/scripts/build-all.sh
            - name: collect the .deb files
              run: |
                  # upload/<component>/*.deb  (component = main | stable | beta)
                  mkdir -p upload
                  cp -r xlibre-work/debs/* upload/ 2>/dev/null || true
                  find upload -mindepth 2 -type f -name '*.deb' | while read -r f; do
                      comp="${f#upload/}"; comp="${comp%%/*}"
                      mkdir -p "upload-flat/$comp"; cp "$f" "upload-flat/$comp/"
                  done
                  rm -rf upload; mv upload-flat upload
            - uses: actions/upload-artifact@v4
              with:
                  name: xlibre-debs-${{ matrix.channel }}-${{ matrix.name }}
                  path: upload
                  retention-days: 14
                  if-no-files-found: ignore
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: xlibre-info-${{ matrix.channel }}-${{ matrix.name }}
                  path: |
                      xlibre-work/BUILD-INFO
                      xlibre-work/FAILED
                  retention-days: 14
                  if-no-files-found: ignore

    install-test:
        name: install ${{ matrix.channel }} ${{ matrix.name }}
        needs: [plan, build]
        # a partial build (only, or commits) has nothing complete to test
        if: ${{ inputs.only == '' && needs.plan.outputs.commit != 'true' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        container:
            image: ${{ matrix.image }}
        strategy:
            fail-fast: false
            # from the plan job: all 10, or only the channels that have a commit
            matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
        defaults:
            run:
                shell: bash
        env:
            DEBIAN_FRONTEND: noninteractive
        steps:
            - name: git and certificates
              run: |
                  for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
                      [ -f "$f" ] && sed -i -E 's#https?://(archive|security)\.ubuntu\.com/ubuntu/?#http://azure.archive.ubuntu.com/ubuntu/#g' "$f"
                  done
                  printf 'Acquire::Retries "5";\n' > /etc/apt/apt.conf.d/80-ci-retries
                  apt-get update
                  apt-get install -y --no-install-recommends git ca-certificates
            - uses: actions/checkout@v4
            - uses: actions/download-artifact@v4
              with:
                  name: xlibre-debs-${{ matrix.channel }}-${{ matrix.name }}
                  path: debs
            - run: xlibre/scripts/test-install.sh debs

    release:
        name: add to the apt repository
        needs: [plan, build, install-test]
        if: ${{ !cancelled() && !failure() && github.event_name == 'workflow_dispatch' && inputs.release }}
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: write
        concurrency:
            group: pool
            cancel-in-progress: false
        env:
            GH_TOKEN: ${{ github.token }}
            PARTIAL: ${{ inputs.only != '' || needs.plan.outputs.commit == 'true' }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  pattern: xlibre-debs-*
                  path: artifacts
            - name: upload to the pool Release
              run: |
                  # Pool asset names: <file> for component main, <component>--<file> otherwise.
                  # `main` (xorgproto) is shared: taken from the beta builds only.
                  gh release view pool -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
                      gh release create pool -R "$GITHUB_REPOSITORY" --title pool \
                          --notes "Todos os .deb do repositório apt. Gerenciado pelos workflows; não edite à mão."
                  mkdir -p pool
                  for d in artifacts/xlibre-debs-*; do
                      channel="$(basename "$d" | cut -d- -f3)"
                      for comp in "$d"/*/; do
                          [ -d "$comp" ] || continue
                          comp="$(basename "$comp")"
                          [ "$comp" = main ] && [ "$channel" != beta ] && continue
                          # a partial run (only, commits) must not replace the shared xorgproto
                          [ "$comp" = main ] && [ "$PARTIAL" = true ] && continue
                          for f in "$d/$comp"/*.deb; do
                              if [ "$comp" = main ]; then n="$(basename "$f")"; else n="$comp--$(basename "$f")"; fi
                              cp "$f" "pool/$n"
                          done
                      done
                  done
                  gh release upload pool -R "$GITHUB_REPOSITORY" --clobber pool/*.deb

    publish:
        needs: release
        if: ${{ !cancelled() && needs.release.result == 'success' }}
        uses: ./.github/workflows/publish.yml
        secrets: inherit
        permissions:
            contents: read
            pages: write
            id-token: write
