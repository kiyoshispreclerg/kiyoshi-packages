# Projetos cujos .deb são ingeridos dos GitHub Releases deles.
# O ingest pega o último Release de cada um e anexa os assets ao Release
# `pool` deste repositório (componente `main`). O alvo (ubuntu22.04, ubuntu24.04,
# debian12, debian13) vem da versão ou, se faltar, do nome do arquivo.
#
# repo:    dono/nome no GitHub
# assets:  glob dos nomes dos assets a importar
# exclude: globs a ignorar (ex.: .deb antigos que sobraram no Release)
projects:
  - name: kikarinhas
    repo: kiyoshispreclerg/kikarinhas
    assets: ["*.deb"]
  - name: kisnitch
    repo: kiyoshispreclerg/kisnitch
    assets: ["*.deb"]
  - name: kiplay
    repo: kiyoshispreclerg/kiplay
    assets: ["*.deb"]
  - name: kisword
    repo: kiyoshispreclerg/kisword
    assets: ["*.deb"]
  - name: kiremote
    repo: kiyoshispreclerg/kiremote
    assets: ["*.deb"]
  - name: kidisks
    repo: kiyoshispreclerg/kidisks
    assets: ["*.deb"]
  - name: kidesktop
    repo: kiyoshispreclerg/kidesktop
    assets: ["kidesktop-core_*.deb", "kidesktop-base_*.deb"]
    exclude: ["kidesktop_0.0.0*"]
  - name: obs-studio
    repo: kiyoshispreclerg/obs-studio
    assets: ["obs-studio-*-Linux-*.deb"]   # sem os *-dbgsym-*.ddeb
